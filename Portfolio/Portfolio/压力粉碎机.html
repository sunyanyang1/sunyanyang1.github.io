<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Python 结课 - 终极解压神器</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #f4f4f9; font-family: 'Microsoft YaHei', sans-serif; }
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 10; pointer-events: none; }
        h1 { color: #333; margin: 0; text-shadow: 2px 2px 0px white; }
        p { color: #666; font-weight: bold; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 5px; display: inline-block; }
        .instruction { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #888; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>💼 职场压力粉碎机</h1>
        <p>当前压力值: <span id="stress-level">100</span>%</p>
    </div>
    <div class="instruction">👉 用鼠标抓起那些烦人的工作，狠狠砸向它们！</div>

    <!-- 引入 Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script>
        // 1. 初始化物理引擎核心模块
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Composites = Matter.Composites,
              Constraint = Matter.Constraint,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events;

        const engine = Engine.create();
        const world = engine.world;

        // 2. 创建渲染器
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false, // 关闭线框模式，显示真实颜色
                background: '#f4f4f9'
            }
        });

        // 3. 定义烦人的“职场元素”
        const annoyingThings = [
            { label: "改需求", color: "#FF6B6B" },
            { label: "写周报", color: "#4ECDC4" },
            { label: "修Bug", color: "#FFE66D" },
            { label: "开会", color: "#1A535C" },
            { label: "PPT", color: "#FF9F1C" },
            { label: "Excel", color: "#2EC4B6" },
            { label: "钉钉", color: "#007AFF" },
            { label: "日报", color: "#E71D36" }
        ];

        const boxes = [];
        // 在屏幕上方随机生成 60 个下落的职场方块
        for (let i = 0; i < 60; i++) {
            const thing = annoyingThings[Math.floor(Math.random() * annoyingThings.length)];
            const size = 60 + Math.random() * 40; // 随机大小
            const x = Math.random() * (window.innerWidth - 100) + 50;
            const y = -Math.random() * 2000 - 100; // 分布在屏幕上方不同高度

            const box = Bodies.rectangle(x, y, size, size, {
                restitution: 0.8, // 弹性：数值越大越弹
                friction: 0.5,    // 摩擦力
                label: thing.label,
                render: {
                    fillStyle: thing.color,
                    strokeStyle: '#333',
                    lineWidth: 2,
                    text: {
                        content: thing.label,
                        color: '#fff',
                        size: 16,
                        family: "Microsoft YaHei"
                    }
                }
            });
            boxes.push(box);
        }
        Composite.add(world, boxes);

        // 4. 创建那个诱人的“下班按钮”（作为不可动的坚固障碍物）
        const leaveBtn = Bodies.rectangle(window.innerWidth / 2, window.innerHeight - 150, 200, 60, {
            isStatic: true, // 静态物体，不会掉落
            restitution: 1,
            label: "一键下班",
            render: {
                fillStyle: '#4CAF50',
                strokeStyle: '#2E7D32',
                lineWidth: 3,
                text: {
                    content: "🚀 一键下班",
                    color: '#fff',
                    size: 24,
                    family: "Microsoft YaHei",
                    weight: "bold"
                }
            }
        });
        Composite.add(world, leaveBtn);

        // 5. 添加边界（地面和墙壁）
        const ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 30, window.innerWidth, 60, { isStatic: true, render: { fillStyle: '#333' } });
        const leftWall = Bodies.rectangle(-30, window.innerHeight / 2, 60, window.innerHeight, { isStatic: true });
        const rightWall = Bodies.rectangle(window.innerWidth + 30, window.innerHeight / 2, 60, window.innerHeight, { isStatic: true });
        Composite.add(world, [ground, leftWall, rightWall]);

        // 6. 添加鼠标交互（核心解压功能：可以抓起方块乱扔）
        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: {
                stiffness: 0.2,
                render: { visible: false }
            }
        });
        Composite.add(world, mouseConstraint);
        render.mouse = mouse; // 保持鼠标与渲染同步

        // 7. 核心黑科技：让 Canvas 渲染出方块里的文字
        Events.on(render, 'afterRender', function() {
            const context = render.context;
            Composite.allBodies(world).forEach(body => {
                if (body.render.text) {
                    const { content, color, size, family, weight } = body.render.text;
                    context.save();
                    context.translate(body.position.x, body.position.y);
                    context.rotate(body.angle);
                    context.fillStyle = color;
                    context.font = `${weight || 'normal'} ${size}px ${family}`;
                    context.textAlign = 'center';
                    context.textBaseline = 'middle';
                    context.fillText(content, 0, 0);
                    context.restore();
                }
            });
        });

        // 8. 碰撞检测彩蛋：当方块砸中“下班按钮”时，压力值减少
        Events.on(engine, 'collisionStart', function(event) {
            const pairs = event.pairs;
            pairs.forEach(pair => {
                const bodyA = pair.bodyA;
                const bodyB = pair.bodyB;
                // 判断是否有一个物体是“下班按钮”
                if (bodyA.label === "一键下班" || bodyB.label === "一键下班") {
                    const stressEl = document.getElementById('stress-level');
                    let currentStress = parseInt(stressEl.innerText);
                    if (currentStress > 0) {
                        stressEl.innerText = Math.max(0, currentStress - 2);
                        // 碰撞时按钮闪一下白光
                        const btn = (bodyA.label === "一键下班") ? bodyA : bodyB;
                        const originalColor = btn.render.fillStyle;
                        btn.render.fillStyle = '#fff';
                        setTimeout(() => { btn.render.fillStyle = originalColor; }, 100);
                    }
                    if (currentStress <= 2) {
                        stressEl.innerText = "0";
                        stressEl.parentElement.innerText = "🎉 压力已清零！恭喜下班！";
                        stressEl.parentElement.style.color = "#4CAF50";
                        stressEl.parentElement.style.fontSize = "24px";
                    }
                }
            });
        });

        // 启动引擎和渲染器
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // 窗口大小改变时自适应
        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            Matter.Body.setPosition(ground, { x: window.innerWidth / 2, y: window.innerHeight + 30 });
            Matter.Body.setPosition(rightWall, { x: window.innerWidth + 30, y: window.innerHeight / 2 });
            Matter.Body.setPosition(leaveBtn, { x: window.innerWidth / 2, y: window.innerHeight - 150 });
        });

    </script>
</body>
</html>
